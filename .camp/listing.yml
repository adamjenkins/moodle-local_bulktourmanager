name: local_bulktourmanager
summary: 'Adds bulk import, export and delete for tool_usertours guided tours directly onto the existing User tours admin page.'
description: |
  Adds bulk operations to *Site administration > Appearance > User tours*
  with no separate admin page: upload a zip of tour-export JSON files to import
  many tours at once, tick tours in the existing list to export them as a
  single zip, or delete them in one confirmed operation. Nothing touches
  Moodle core — the controls are injected via the
  `before_footer_html_generation` hook.
